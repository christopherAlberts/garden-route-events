<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Garden Route Events has moved</title>
<meta http-equiv="refresh" content="6;url=https://gardenrouteevents.streblainnovations.com/signup">
<link rel="canonical" href="https://gardenrouteevents.streblainnovations.com/">
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:linear-gradient(160deg,#0f3d3e,#1b6b5f);color:#1b2a2a}
.card{background:#fff;width:min(92vw,460px);padding:32px;border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.25);text-align:center}h1{margin:0 0 10px;color:#0f3d3e}p{color:#4b5b5b;line-height:1.5}
a.btn{display:inline-block;margin:18px 0 8px;padding:14px 26px;border-radius:12px;background:#f2b705;color:#1b2a2a;font-weight:700;text-decoration:none;font-size:1.05rem}small{color:#7a8a8a}</style></head>
<body><main class="card"><div style="font-size:2.4rem">🌊🎶</div><h1>We've moved!</h1>
<p>Garden Route Events has a new home. Create a <b>free account</b> to keep browsing concerts, festivals, markets, films and more from Cape Town to Jeffreys Bay.</p>
<a class="btn" href="https://gardenrouteevents.streblainnovations.com/signup">Create your free account</a><br>
<small>Already signed up? <a href="https://gardenrouteevents.streblainnovations.com/login">Log in</a><br>Taking you there in <span id="n">6</span> seconds…</small></main>
<script>if(navigator.serviceWorker)navigator.serviceWorker.getRegistrations().then(r=>r.forEach(x=>x.unregister()));if(window.caches)caches.keys().then(k=>k.forEach(c=>caches.delete(c)));
var n=6;setInterval(function(){n--;if(n>=0)document.getElementById('n').textContent=n;if(n===0)location.replace('https://gardenrouteevents.streblainnovations.com/signup');},1000);</script>
</body></html>
